[project]
name = "mlwint"
version = "0.1.0"
description = "Machine-learning malware detection research using EMBER features"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{name = "Kalmit Kulkarni"}]
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires local trained model artifacts"]

[tool.ruff]
target-version = "py313"
line-length = 100
